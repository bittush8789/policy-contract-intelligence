# ==============================================================================
# Enterprise RAG Assistant — CI/CD Pipeline
#
# Flow: Git Push → Lint → Unit Tests → RAG Tests → Build Docker
#       → Trivy Scan → Evaluation Tests → Push to ECR
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   AWS_ACCESS_KEY_ID       - IAM user access key with ECR permissions
#   AWS_SECRET_ACCESS_KEY   - IAM user secret key
#   AWS_REGION              - e.g. us-east-1
#   ECR_REPOSITORY          - ECR repository name e.g. enterprise-rag-assistant
#   PINECONE_API_KEY        - Used only in Evaluation Tests job
#   GROQ_API_KEY            - Used only in Evaluation Tests job
# ==============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:          # Allow manual trigger from GitHub Actions UI

# Cancel in-progress runs on the same branch to avoid queue buildup
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: enterprise-rag-assistant

# ==============================================================================
# STAGE 1 — LINT
# Fast static analysis; fails fast before expensive jobs run.
# ==============================================================================
jobs:
  lint:
    name: "Lint & Code Quality"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: pip install --no-cache-dir ruff

      - name: Run Ruff linter
        run: |
          ruff check backend/ tests/ scripts/ \
            --select=E,W,F,I \
            --ignore=E501 \
            --output-format=github

      - name: Check import order
        run: ruff check backend/ tests/ --select=I --fix --diff

  # ==============================================================================
  # STAGE 2 — UNIT TESTS
  # Full offline test suite (34 tests). No real API keys needed.
  # ==============================================================================
  unit-tests:
    name: "Unit Tests (Offline)"
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run unit tests
        env:
          PINECONE_API_KEY: mock_pinecone_key
          GROQ_API_KEY: mock_groq_key
          PINECONE_INDEX_NAME: enterprise-rag
          USE_TF: "0"
          TRANSFORMERS_NO_TF: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_evaluation.py \
            -v \
            --tb=short \
            --junitxml=reports/unit-test-results.xml

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: reports/unit-test-results.xml

  # ==============================================================================
  # STAGE 3 — RAG PIPELINE TESTS
  # Tests retrieval, reranker, guardrails, and ingestion in isolation.
  # ==============================================================================
  rag-tests:
    name: "RAG Pipeline Tests"
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Cache HuggingFace model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-bge-small-reranker-v2-m3
          restore-keys: hf-models-${{ runner.os }}-

      - name: Run RAG-specific tests (retrieval, reranker, guardrails, ingestion)
        env:
          PINECONE_API_KEY: mock_pinecone_key
          GROQ_API_KEY: mock_groq_key
          PINECONE_INDEX_NAME: enterprise-rag
          USE_TF: "0"
          TRANSFORMERS_NO_TF: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python -m pytest tests/test_retrieval.py \
                           tests/test_reranker.py \
                           tests/test_guardrails.py \
                           tests/test_ingestion.py \
            -v \
            --tb=short \
            --junitxml=reports/rag-test-results.xml

      - name: Upload RAG test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-test-results
          path: reports/rag-test-results.xml

  # ==============================================================================
  # STAGE 4 — BUILD DOCKER IMAGE
  # Builds the multi-stage Docker image and exports it as a tarball for
  # downstream jobs (Trivy scan + push to ECR).
  # ==============================================================================
  build-docker:
    name: "Build Docker Image"
    runs-on: ubuntu-latest
    needs: [unit-tests, rag-tests]
    timeout-minutes: 30

    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
      short-sha: ${{ steps.sha.outputs.short-sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get short Git SHA
        id: sha
        run: echo "short-sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set image metadata
        id: meta
        run: |
          TAG="${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short-sha }}"
          echo "image-tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Built image tag: ${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short-sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      - name: Upload Docker image tarball
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  # ==============================================================================
  # STAGE 5 — TRIVY SECURITY SCAN
  # Scans the built Docker image for HIGH/CRITICAL CVEs.
  # Fails the pipeline if any CRITICAL vulnerabilities are found.
  # ==============================================================================
  trivy-scan:
    name: "Trivy Security Scan"
    runs-on: ubuntu-latest
    needs: build-docker
    timeout-minutes: 15

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image tarball
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/image.tar

      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ needs.build-docker.outputs.short-sha }}"
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container-scan

      - name: Run Trivy (human-readable table summary)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ needs.build-docker.outputs.short-sha }}"
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  # ==============================================================================
  # STAGE 6 — RAGAS EVALUATION TESTS
  # Runs the offline RAGAS unit tests covering Faithfulness, Relevancy,
  # Precision, and Recall metrics.
  # ==============================================================================
  evaluation-tests:
    name: "RAGAS Evaluation Tests"
    runs-on: ubuntu-latest
    needs: [unit-tests, rag-tests]
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run RAGAS evaluation unit tests
        env:
          PINECONE_API_KEY: mock_pinecone_key
          GROQ_API_KEY: mock_groq_key
          PINECONE_INDEX_NAME: enterprise-rag
          USE_TF: "0"
          TRANSFORMERS_NO_TF: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python -m pytest tests/test_evaluation.py \
            -v \
            --tb=short \
            --junitxml=reports/evaluation-test-results.xml

      - name: Upload evaluation test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-test-results
          path: reports/evaluation-test-results.xml

  # ==============================================================================
  # STAGE 7 — PUSH TO AWS ECR
  # Authenticates to ECR, tags the image with short-SHA + latest, and pushes.
  # Only runs on pushes to main/master (not on PRs or develop branch).
  # ==============================================================================
  push-to-ecr:
    name: "Push to AWS ECR"
    runs-on: ubuntu-latest
    needs: [trivy-scan, evaluation-tests]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 20

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image tarball
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/image.tar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build ECR image URI
        id: ecr-uri
        run: |
          ECR_URI="${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}"
          echo "ecr-uri=${ECR_URI}" >> $GITHUB_OUTPUT

      - name: Tag image for ECR
        run: |
          SHORT_SHA="${{ needs.build-docker.outputs.short-sha }}"
          ECR_URI="${{ steps.ecr-uri.outputs.ecr-uri }}"
          docker tag "${{ env.IMAGE_NAME }}:${SHORT_SHA}" "${ECR_URI}:${SHORT_SHA}"
          docker tag "${{ env.IMAGE_NAME }}:${SHORT_SHA}" "${ECR_URI}:latest"

      - name: Push image to ECR
        run: |
          SHORT_SHA="${{ needs.build-docker.outputs.short-sha }}"
          ECR_URI="${{ steps.ecr-uri.outputs.ecr-uri }}"
          docker push "${ECR_URI}:${SHORT_SHA}"
          docker push "${ECR_URI}:latest"
          echo "Pushed ${ECR_URI}:${SHORT_SHA}"
          echo "Pushed ${ECR_URI}:latest"

      - name: Write deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ steps.ecr-uri.outputs.ecr-uri }}:${{ needs.build-docker.outputs.short-sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Git SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pushed by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | $(date -u +'%Y-%m-%dT%H:%M:%SZ') |" >> $GITHUB_STEP_SUMMARY
